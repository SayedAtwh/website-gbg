apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "'https://github.com/SayedAtwh/website-gbg.git'"
    targetRevision: main
    path: k8s
    directory:
      recurse: true

  destination:
    server: "https://kubernetes.default.svc"
    namespace: depi-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 10